services:
  - type: web
    name: hm-token-intelligence-pwa
    runtime: static
    rootDir: pwa
    buildCommand: npm install && npm run build
    staticPublishPath: dist
  - type: web
    name: hm-token-intelligence-mcp
    runtime: docker
    dockerfilePath: ./mcp-server/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
