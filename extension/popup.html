<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Prompt Assistant</title>
<style>
body{font:14px system-ui;width:310px;padding:15px;background:#101827;color:#f8fafc}
h3{margin:0 0 8px;color:#e3bd75}p{line-height:1.5;color:#cbd5e1}.note{font-size:12px;color:#94a3b8}
button{width:100%;padding:11px;border:0;border-radius:9px;background:#d6a84f;color:#111827;font-weight:700;cursor:pointer}
strong{color:#e8d0a0}
</style></head>
<body>
<h3>HM PROMPT ASSISTANT</h3>
<p>Nhấn nút bên dưới để mở bảng HM ngay trên trang AI. Popup này sẽ tự đóng để trả lại chuột và bàn phím cho ChatGPT. Bạn cũng có thể bấm nút HM màu vàng nằm cạnh ô nhập.</p>
<button id="analyze">Mở HM tại ô chat hiện tại</button>
<p id="status" class="note">HM không tự gửi prompt. Khi popup đóng, bạn có thể tiếp tục nhập nội dung trong ô chat.</p>
<script src="popup.js"></script>
</body></html>
