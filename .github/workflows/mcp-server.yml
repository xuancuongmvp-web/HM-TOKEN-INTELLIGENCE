name: HM Node project checks
on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - "pwa/**"
      - "extension/**"
      - "plugins/**"
      - ".agents/plugins/**"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - "pwa/**"
      - "extension/**"
      - "plugins/**"
      - ".agents/plugins/**"
      - ".github/workflows/mcp-server.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package.json
      - name: Install dependencies
        working-directory: mcp-server
        run: npm install
      - name: Audit production dependencies
        working-directory: mcp-server
        run: npm audit --omit=dev --audit-level=high
      - name: Build deployment Docker image
        run: docker build -f mcp-server/Dockerfile -t hm-token-intelligence-mcp .
      - name: Validate portable HM plugin package
        run: |
          node -e "const fs=require('fs'); const p=require('./plugins/hm-token-intelligence/plugin.json'); if(p.name!=='hm-token-intelligence'||!p.version||!p.description) process.exit(1); const onboarding=p.extensions?.['com.openai']?.onboardingSkill; if(!onboarding||!fs.existsSync('./plugins/hm-token-intelligence/'+onboarding.replace(/^\\.\\//,''))) process.exit(1); if(!fs.existsSync('./plugins/hm-token-intelligence/skills/hm-prompt-intelligence/SKILL.md')) process.exit(1); if(!fs.existsSync('./plugins/hm-token-intelligence/skills/hm-prompt-intelligence/agents/openai.yaml')) process.exit(1); if(!fs.existsSync('./plugins/hm-token-intelligence/assets/hm-icon.svg')) process.exit(1)"
          node -e "const fs=require('fs'); const s=fs.readFileSync('./plugins/hm-token-intelligence/skills/hm-prompt-intelligence/SKILL.md','utf8'); if(!s.startsWith('---\\nname: hm-prompt-intelligence\\ndescription:')||!s.includes('\\n---\\n')) process.exit(1)"
          node -e "const fs=require('fs'); const m=require('./.agents/plugins/marketplace.json'); const p=m.plugins?.find(x=>x.name==='hm-token-intelligence'); if(!p||p.source?.source!=='local'||p.source?.path!=='./plugins/hm-token-intelligence'||p.policy?.installation!=='AVAILABLE'||!p.category) process.exit(1); if(!fs.existsSync(p.source.path+'/plugin.json')) process.exit(1)"
      - name: Package standalone skill and portable plugin
        run: |
          mkdir -p dist
          mkdir -p dist/skill/hm-prompt-intelligence
          cp plugins/hm-token-intelligence/skills/hm-prompt-intelligence/SKILL.md dist/skill/hm-prompt-intelligence/
          cp -R plugins/hm-token-intelligence/skills/hm-prompt-intelligence/agents dist/skill/hm-prompt-intelligence/
          cp plugins/hm-token-intelligence/skills/hm-prompt-intelligence/README.md dist/skill/hm-prompt-intelligence/
          (cd dist/skill && zip -qr ../hm-prompt-intelligence-skill.zip hm-prompt-intelligence)
          mkdir -p dist/plugin/hm-token-intelligence
          cp -R plugins/hm-token-intelligence/. dist/plugin/hm-token-intelligence/
          (cd dist/plugin && zip -qr ../hm-token-intelligence-plugin.zip hm-token-intelligence)
      - name: Upload installable HM packages
        uses: actions/upload-artifact@v4
        with:
          name: hm-token-intelligence-installers
          path: |
            dist/hm-prompt-intelligence-skill.zip
            dist/hm-token-intelligence-plugin.zip
          if-no-files-found: error
          retention-days: 30
      - name: Check browser extension JavaScript syntax
        run: node --check extension/content.js && node --check extension/popup.js
      - name: Run MCP tests
        working-directory: mcp-server
        run: npm test
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm install
      - name: Audit PWA dependencies
        working-directory: pwa
        run: npm audit --audit-level=high
      - name: Run PWA analyzer tests
        working-directory: pwa
        run: npm test
      - name: Build PWA
        working-directory: pwa
        run: npm run build
