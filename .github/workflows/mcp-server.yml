name: HM Node project checks
on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - "pwa/**"
      - "extension/**"
      - "plugins/**"
      - ".agents/plugins/**"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - "pwa/**"
      - "extension/**"
      - "plugins/**"
      - ".agents/plugins/**"
      - ".github/workflows/mcp-server.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package.json
      - name: Install dependencies
        working-directory: mcp-server
        run: npm install
      - name: Audit production dependencies
        working-directory: mcp-server
        run: npm audit --omit=dev --audit-level=high
      - name: Build deployment Docker image
        run: docker build -f mcp-server/Dockerfile -t hm-token-intelligence-mcp .
      - name: Validate portable HM plugin package
        run: |
          node -e "const p=require('./plugins/hm-token-intelligence/plugin.json'); if(p.name!=='hm-token-intelligence'||!p.version||!p.description) process.exit(1)"
          node -e "const fs=require('fs'); const s=fs.readFileSync('plugins/hm-token-intelligence/skills/hm-prompt-intelligence/SKILL.md','utf8'); if(!s.startsWith('---\\nname: hm-prompt-intelligence\\ndescription:')||!s.includes('\\n---\\n')) process.exit(1)"
          node -e "const m=require('./.agents/plugins/marketplace.json'); if(!m.plugins||m.plugins[0].name!=='hm-token-intelligence') process.exit(1)"
      - name: Check browser extension JavaScript syntax
        run: node --check extension/content.js && node --check extension/popup.js
      - name: Run MCP tests
        working-directory: mcp-server
        run: npm test
      - name: Install PWA dependencies
        working-directory: pwa
        run: npm install
      - name: Audit PWA dependencies
        working-directory: pwa
        run: npm audit --audit-level=high
      - name: Run PWA analyzer tests
        working-directory: pwa
        run: npm test
      - name: Build PWA
        working-directory: pwa
        run: npm run build
