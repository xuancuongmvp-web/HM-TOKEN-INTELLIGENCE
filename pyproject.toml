[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-token-intelligence"
version = "0.1.0"
description = "Model-aware token counting and conservative prompt optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["tiktoken>=0.7.0", "fastapi>=0.110.0", "uvicorn>=0.27.0", "pydantic>=2.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.3.0"]

[project.scripts]
hm-token = "hm_token_intelligence.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
